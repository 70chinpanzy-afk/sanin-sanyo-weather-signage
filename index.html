<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="refresh" content="21600">
<title>中国地方 ドライバー天気予報</title>
<style>
/* 旧型STBブラウザ対応のため、CSS変数・grid・clamp() は使わず flexbox と vw のみで構成 */
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#071a2c;color:#f7fbff;font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif}
#app{position:absolute;top:0;left:0;right:0;bottom:0;padding:2vh 1.8vw;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column}
.row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.grow{-webkit-box-flex:1;-webkit-flex:1 1 0;flex:1 1 0;min-width:0;min-height:0}
header{-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:1.6vh}
.brandmark{width:3.4vw;height:3.4vw;border-radius:.8vw;background:#2f8fe0;color:#fff;font-size:2vw;font-weight:bold;line-height:3.4vw;text-align:center;margin-right:1vw}
h1{margin:0;font-size:2.2vw;letter-spacing:.04em}
.sub{margin-top:.3vh;color:#a9bed0;font-size:1vw}
.clock{text-align:right}
.time{font-size:3vw;font-weight:bold;line-height:1}
.date{margin-top:.6vh;color:#a9bed0;font-size:1.05vw}
#cards{-webkit-box-align:stretch;-webkit-align-items:stretch;align-items:stretch}
.card{margin-right:1.2vw;border:1px solid #2a4660;border-top:.5vh solid #35d0ff;border-radius:1.2vw;background:#11304a;padding:1.6vh 1vw;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column}
.card:last-child{margin-right:0}
.prefrow{-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;-webkit-box-align:start;-webkit-align-items:flex-start;align-items:flex-start}
.pref{font-size:1.9vw;font-weight:bold}
.area{font-size:.8vw;color:#a9bed0;margin-top:.4vh}
.status{font-size:.75vw;color:#65e0a3;background:#173f3a;padding:.4vh .5vw;border-radius:1vw;white-space:nowrap}
.status.error{color:#ffb0b9;background:#4a1f2a}
.days{margin-top:1.4vh;-webkit-box-align:stretch;-webkit-align-items:stretch;align-items:stretch}
.day{margin-right:.5vw;background:#0a2236;border:1px solid #223b52;border-radius:.8vw;padding:1.2vh .3vw;text-align:center}
.day:last-child{margin-right:0}
.day.today{border-color:#35d0ff;background:#0c2a42}
.dayname{font-size:.95vw;font-weight:bold;color:#d9efff}
.daydate{font-size:.7vw;color:#a9bed0;margin-top:.2vh}
.dayicon{font-size:3vw;line-height:1.25;margin:.6vh 0}
.daywx{font-size:.78vw;font-weight:bold;line-height:1.3;height:5.2em;overflow:hidden}
.daytemps{font-size:1.1vw;font-weight:bold;margin-top:.8vh}
.hi{color:#ff968c}.lo{color:#72ccff}
.daypop{font-size:.8vw;color:#d8e8f4;margin-top:.4vh}
.metric{margin-top:1.2vh;background:#0a2236;border:1px solid #223b52;border-radius:.7vw;padding:1vh .6vw}
.mlabel{color:#a9bed0;font-size:.72vw}
.mvalue{font-size:.95vw;font-weight:bold;margin-top:.3vh;line-height:1.35}
.warning{color:#fff;background:#a92f43;padding:.2vh .4vw;border-radius:.4vw}
footer{margin-top:1.6vh}
.advice{background:#173a52;border:1px solid #2a4c66;border-radius:1vw;padding:1.3vh 1.2vw}
.adviceIcon{font-size:2.2vw;margin-right:1vw}
.adviceTitle{color:#ffd166;font-size:.9vw;font-weight:bold}
.adviceText{font-size:1.3vw;font-weight:bold;margin-top:.3vh}
.meta{margin-left:1.5vw;text-align:right;color:#a9bed0;font-size:.78vw;line-height:1.6}
.err{color:#ffb0b9}
#ua{font-size:.55vw;color:#5f7a90;max-width:30vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:auto}
</style>
</head>
<body>
<div id="app">
<header class="row"><div class="row"><div class="brandmark">天</div><div><h1>中国地方 ドライバー天気予報</h1><div class="sub">出発前に確認：雨・雪・風・警報</div></div></div><div class="clock"><div class="time" id="clock">--:--</div><div class="date" id="date">ページ読込中</div></div></header>
<div class="row grow" id="cards"></div>
<footer class="row"><div class="advice row grow"><div class="adviceIcon" id="adviceIcon">&#10003;</div><div class="grow"><div class="adviceTitle">本日の運転ポイント</div><div class="adviceText" id="adviceText">最新の予報を取得しています</div></div></div><div class="meta"><div id="updated">更新確認中</div><div>出典：気象庁　｜　予報30分・警報10分ごとに確認</div><div id="ua"></div></div></footer>
</div>
<script>
// 旧型ブラウザ（Android WebView 等）でも動くよう ES5 のみで記述しています。
// （?. / => / async / テンプレート文字列 / fetch / Promise などは使用しない）
var errorShown = false;
window.onerror = function (msg, src, line) {
  var el = document.getElementById('updated');
  if (el && !errorShown) { errorShown = true; el.className = 'err'; el.innerHTML = '';
    el.appendChild(document.createTextNode('スクリプトエラー: ' + msg + ' (行' + line + ')')); }
  return false;
};

var PREFS = [
  { name: '島根県', code: '320000', accent: '#51d5c7' },
  { name: '鳥取県', code: '310000', accent: '#65a9ff' },
  { name: '広島県', code: '340000', accent: '#ffbe55' },
  { name: '岡山県', code: '330000', accent: '#c58cff' }
];
var JMA = 'https://www.jma.go.jp/bosai';
var WARN_NAMES = {
  '02': '暴風雪警報', '03': '大雨警報', '04': '洪水警報', '05': '暴風警報', '06': '大雪警報', '07': '波浪警報', '08': '高潮警報',
  '10': '大雨注意報', '12': '大雪注意報', '13': '風雪注意報', '14': '雷注意報', '15': '強風注意報', '16': '波浪注意報',
  '17': '融雪注意報', '18': '洪水注意報', '19': '高潮注意報', '20': '濃霧注意報', '21': '乾燥注意報', '22': 'なだれ注意報',
  '23': '低温注意報', '24': '霜注意報', '25': '着氷注意報', '26': '着雪注意報',
  '32': '暴風雪特別警報', '33': '大雨特別警報', '35': '暴風特別警報', '36': '大雪特別警報', '37': '波浪特別警報', '38': '高潮特別警報'
};
var WD = ['日', '月', '火', '水', '木', '金', '土'];
var state = { forecasts: {}, warnings: {}, lastUpdate: null };

// ---- 小物 ----
function pad(n) { return (n < 10 ? '0' : '') + n; }
function jst(d) { return new Date((d ? d.getTime() : new Date().getTime()) + 9 * 3600 * 1000); } // getUTC* で日本時間を読む
function ymd(d) { var j = jst(d); return j.getUTCFullYear() + '-' + pad(j.getUTCMonth() + 1) + '-' + pad(j.getUTCDate()); }
function clean(s) { return String(s || '').replace(/[　\s]+/g, ' ').replace(/^ | $/g, ''); }
function num(v) { if (v === '' || v === null || v === undefined) return null; var n = Number(v); return isFinite(n) ? n : null; }
function get(o, path) { for (var i = 0; i < path.length; i++) { if (o === null || o === undefined) return undefined; o = o[path[i]]; } return o; }
function findTs(list, key) { list = list || []; for (var i = 0; i < list.length; i++) { if (get(list[i], ['areas', 0, key])) return list[i]; } return null; }
function setText(root, sel, text) { var el = root.querySelector(sel); if (el) el.innerHTML = ''; if (el) el.appendChild(document.createTextNode(text)); return el; }
function iconFor(code) { var n = Number(code); if (!code || !isFinite(n)) return '—'; if (n >= 400) return '❄'; if (n >= 300) return '☂'; if (n >= 200) return '☁'; return '☀'; }

function getJson(url, cb) {
  var x = new XMLHttpRequest(), done = false;
  function finish(err, j) { if (!done) { done = true; cb(err, j); } }
  x.open('GET', url, true);
  try { x.timeout = 20000; } catch (e) {}
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status !== 200) { finish(x.status ? 'HTTP ' + x.status : '通信不可'); return; }
    var j; try { j = JSON.parse(x.responseText); } catch (e) { finish('データ形式エラー'); return; }
    finish(null, j);
  };
  x.ontimeout = function () { finish('タイムアウト'); };
  x.send();
}

// ---- 予報の解析 ----
function dateValues(ts, idx, key, today) {
  var out = [];
  if (!ts || !ts.timeDefines || !get(ts, ['areas', idx])) return out;
  var vals = ts.areas[idx][key] || [];
  for (var i = 0; i < ts.timeDefines.length; i++) {
    if (ts.timeDefines[i].indexOf(today) === 0) { var n = num(vals[i]); if (n !== null) out.push(n); }
  }
  return out;
}
function maxOf(a) { return a.length ? Math.max.apply(null, a) : null; }
function minOf(a) { return a.length ? Math.min.apply(null, a) : null; }

function parseForecast(json) {
  var short = json[0] || {}, weekly = json[1] || {}, today = ymd(), i;
  var wxTs = findTs(short.timeSeries, 'weathers'), area = get(wxTs, ['areas', 0]) || {};
  var popTs = findTs(short.timeSeries, 'pops'), popIdx = 0;
  if (popTs) for (i = 0; i < popTs.areas.length; i++) if (get(popTs.areas[i], ['area', 'code']) === get(area, ['area', 'code'])) { popIdx = i; break; }
  var tempTs = findTs(short.timeSeries, 'temps'), temps = [];
  if (tempTs) for (i = 0; i < tempTs.areas.length; i++) temps = temps.concat(dateValues(tempTs, i, 'temps', today));
  var days = [{
    date: today, weather: clean(get(area, ['weathers', 0]) || '情報なし'), code: get(area, ['weatherCodes', 0]) || '',
    pop: maxOf(dateValues(popTs, popIdx, 'pops', today)), min: minOf(temps), max: maxOf(temps)
  }];
  // 明日以降：短期予報の天気文を優先し、気温・降水は週間予報
  var wts = findTs(weekly.timeSeries, 'weatherCodes'), wa = get(wts, ['areas', 0]) || {};
  var tts = findTs(weekly.timeSeries, 'tempsMin'), ta = get(tts, ['areas', 0]) || {};
  var shortDefs = (wxTs && wxTs.timeDefines) || [];
  var wDefs = (wts && wts.timeDefines) || [];
  for (i = 0; i < wDefs.length && days.length < 3; i++) {
    var date = wDefs[i].slice(0, 10), wx = '', k;
    if (date <= today) continue;
    for (k = 0; k < shortDefs.length; k++) if (shortDefs[k].indexOf(date) === 0) wx = clean(get(area, ['weathers', k]));
    var st = dateValues(tempTs, 0, 'temps', date); // 週間予報に無い明日の気温は短期予報の代表地点で補完
    var mn = num((ta.tempsMin || [])[i]), mx = num((ta.tempsMax || [])[i]);
    if (mn === null && st.length > 1) mn = minOf(st);
    if (mx === null && st.length) mx = maxOf(st);
    days.push({ date: date, weather: wx || '週間予報', code: (wa.weatherCodes || [])[i] || '',
      pop: num((wa.pops || [])[i]), min: mn, max: mx });
  }
  while (days.length < 3) {
    var last = days[days.length - 1].date.split('-');
    var nd = new Date(Date.UTC(+last[0], +last[1] - 1, +last[2] + 1) - 9 * 3600 * 1000);
    days.push({ date: ymd(nd), weather: '情報なし', code: '', pop: null, min: null, max: null });
  }
  return { area: get(area, ['area', 'name']) || get(wa, ['area', 'name']) || '県内', days: days, wind: clean(get(area, ['winds', 0]) || '情報なし') };
}

function parseWarnings(json) {
  var seen = {}, out = [];
  function add(n) { if (n && !seen[n]) { seen[n] = 1; out.push(n); } }
  function walk(x) {
    if (!x || typeof x !== 'object') return;
    if (x instanceof Array) { for (var i = 0; i < x.length; i++) walk(x[i]); return; }
    if ((x.status === '発表' || x.status === '継続') && x.code) add(WARN_NAMES[x.code] || x.name);
    for (var k in x) if (x.hasOwnProperty(k)) walk(x[k]);
  }
  walk(json && json.areaTypes ? json.areaTypes : json);
  out.sort(function (a, b) { return (b.indexOf('警報') >= 0) - (a.indexOf('警報') >= 0); }); // 警報を先頭に
  return out;
}

// ---- 取得 ----
function updateForecasts() {
  var left = PREFS.length;
  for (var i = 0; i < PREFS.length; i++) (function (p) {
    getJson(JMA + '/forecast/data/forecast/' + p.code + '.json?ts=' + new Date().getTime(), function (err, j) {
      if (err) { if (!state.forecasts[p.code] || state.forecasts[p.code].error) state.forecasts[p.code] = { error: err }; }
      else { try { state.forecasts[p.code] = parseForecast(j); } catch (e) { state.forecasts[p.code] = { error: '解析エラー' }; } }
      if (--left === 0) { state.lastUpdate = new Date(); }
      render();
    });
  })(PREFS[i]);
}
function updateWarnings() {
  for (var i = 0; i < PREFS.length; i++) (function (p) {
    getJson(JMA + '/warning/data/warning/' + p.code + '.json?ts=' + new Date().getTime(), function (err, j) {
      if (!err) { try { state.warnings[p.code] = parseWarnings(j); } catch (e) {} }
      render();
    });
  })(PREFS[i]);
}

// ---- 描画 ----
function buildCards() {
  var html = '';
  for (var i = 0; i < PREFS.length; i++) {
    var p = PREFS[i], days = '';
    for (var d = 0; d < 3; d++) days += '<div class="day grow' + (d === 0 ? ' today' : '') + '"><div class="dayname">--</div><div class="daydate">--/--</div><div class="dayicon">&middot;</div><div class="daywx">取得中</div><div class="daytemps"><span class="hi">--°</span> / <span class="lo">--°</span></div><div class="daypop">降水 --%</div></div>';
    html += '<div class="card grow" id="card-' + p.code + '" style="border-top-color:' + p.accent + '">' +
      '<div class="row prefrow"><div><div class="pref">' + p.name + '</div><div class="area">取得中</div></div><div class="status">取得中</div></div>' +
      '<div class="row days">' + days + '</div>' +
      '<div class="metric"><div class="mlabel">警報・注意報</div><div class="mvalue alerts">確認中</div></div>' +
      '<div class="metric"><div class="mlabel">今日の風</div><div class="mvalue wind">--</div></div></div>';
  }
  document.getElementById('cards').innerHTML = html;
}

function fmtDay(date, i) {
  var a = date.split('-'), d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]));
  return { name: i === 0 ? '今日' : i === 1 ? '明日' : '明後日', date: (+a[1]) + '/' + (+a[2]) + ' (' + WD[d.getUTCDay()] + ')' };
}
function fmtTime(d) { var j = jst(d); return (j.getUTCMonth() + 1) + '/' + j.getUTCDate() + ' ' + pad(j.getUTCHours()) + ':' + pad(j.getUTCMinutes()); }

function render() {
  var allWarn = [], snow = false, heavy = false, strong = false, okCount = 0, i, k;
  for (i = 0; i < PREFS.length; i++) {
    var p = PREFS[i], el = document.getElementById('card-' + p.code), d = state.forecasts[p.code], w = state.warnings[p.code];
    if (w) for (k = 0; k < w.length; k++) if (allWarn.indexOf(w[k]) < 0) allWarn.push(w[k]);
    var ae = el.querySelector('.alerts');
    if (w) { setText(el, '.alerts', w.length ? w.slice(0, 4).join('・') : '発表なし'); ae.className = 'mvalue alerts' + (w.length ? ' warning' : ''); }
    if (!d) continue;
    var st = el.querySelector('.status');
    if (d.error) { st.className = 'status error'; setText(el, '.status', '取得エラー'); setText(el, '.area', d.error); continue; }
    okCount++;
    st.className = 'status'; setText(el, '.status', '最新');
    setText(el, '.area', d.area + 'の3日予報');
    var dayEls = el.querySelectorAll('.day');
    for (k = 0; k < dayEls.length; k++) {
      var x = d.days[k], de = dayEls[k], f = fmtDay(x.date, k);
      setText(de, '.dayname', f.name); setText(de, '.daydate', f.date);
      setText(de, '.dayicon', iconFor(x.code)); setText(de, '.daywx', x.weather);
      setText(de, '.hi', x.max === null ? '--°' : x.max + '°'); setText(de, '.lo', x.min === null ? '--°' : x.min + '°');
      setText(de, '.daypop', x.pop === null ? '降水 --%' : '降水 ' + x.pop + '%');
      if (Number(x.code) >= 400) snow = true;
    }
    setText(el, '.wind', d.wind);
    if (d.days[0].pop !== null && d.days[0].pop >= 50) heavy = true;
    if (/強/.test(d.wind)) strong = true;
  }
  var msg = '時間に余裕を持ち、車間距離を十分に確保してください。', ico = '✓';
  if (allWarn.length) { msg = '警報・注意報発表中：' + allWarn.slice(0, 4).join('・') + '。出発前に対象地域を確認してください。'; ico = '⚠'; }
  else if (snow) { msg = '3日以内に降雪傾向あり。冬用装備、橋上・日陰・峠道を確認。'; ico = '❄'; }
  else if (heavy) { msg = '本日、降水確率が高い地域あり。早めの減速、車間距離確保、冠水路の回避を。'; ico = '☂'; }
  else if (strong) { msg = '強風予報あり。横風、橋上、トンネル出口、空荷車両のふらつきに注意。'; ico = '⚑'; }
  if (state.lastUpdate && okCount === 0) { msg = '予報を取得できませんでした。STBのネット接続・気象庁サイトへの通信可否を確認してください。'; ico = '⚠'; }
  setText(document, '#adviceText', msg); setText(document, '#adviceIcon', ico);
  if (state.lastUpdate && !errorShown) setText(document, '#updated', (okCount ? '最終取得：' : '取得失敗：') + fmtTime(state.lastUpdate));
}

function tick() {
  var j = jst();
  setText(document, '#clock', pad(j.getUTCHours()) + ':' + pad(j.getUTCMinutes()));
  setText(document, '#date', j.getUTCFullYear() + '年' + (j.getUTCMonth() + 1) + '月' + j.getUTCDate() + '日 ' + WD[j.getUTCDay()] + '曜日');
}

buildCards();
setText(document, '#ua', navigator.userAgent);
tick();
setInterval(tick, 1000);
updateForecasts();
updateWarnings();
setInterval(updateForecasts, 30 * 60 * 1000);
setInterval(updateWarnings, 10 * 60 * 1000);
</script>
</body>
</html>
