<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>中国地方 ドライバー天気予報</title>
<style>
:root{--bg:#061525;--panel:#10283f;--panel2:#17354f;--text:#f7fbff;--muted:#a9bed0;--cyan:#35d0ff;--yellow:#ffd166;--red:#ff6577;--green:#65e0a3}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
body{background:radial-gradient(circle at 18% 0%,#143f60 0,transparent 34%),linear-gradient(145deg,#05111f,#0b2033 58%,#071522)}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;padding:2.2vh 2vw}
header{display:flex;align-items:center;justify-content:space-between;min-height:8vh}
.brand{display:flex;align-items:center;gap:1.1vw}.brandmark{width:3.2vw;height:3.2vw;min-width:50px;min-height:50px;border-radius:15px;background:linear-gradient(145deg,var(--cyan),#4a81ff);display:grid;place-items:center;font-size:1.8vw;box-shadow:0 10px 28px #00111faa}
h1{margin:0;font-size:clamp(28px,2.25vw,44px);letter-spacing:.04em}.sub{margin-top:.35vh;color:var(--muted);font-size:clamp(14px,1vw,20px)}
.clock{text-align:right}.time{font-size:clamp(32px,3vw,58px);font-weight:800;line-height:1}.date{margin-top:.6vh;color:var(--muted);font-size:clamp(14px,1.05vw,21px)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.3vw;min-height:0}
.card{position:relative;overflow:hidden;border:1px solid #ffffff17;border-radius:24px;background:linear-gradient(160deg,#193a55e8,#0c2237e8);box-shadow:0 18px 50px #0008;padding:1.7vh 1.15vw;display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--accent,var(--cyan))}.prefrow{display:flex;justify-content:space-between;align-items:start}.pref{font-size:clamp(25px,2vw,39px);font-weight:850}.area{font-size:clamp(12px,.8vw,16px);color:var(--muted);margin-top:.5vh}.status{font-size:clamp(11px,.72vw,14px);color:var(--green);background:#65e0a31b;padding:.45vh .55vw;border-radius:999px;white-space:nowrap}
.hero{display:flex;align-items:center;justify-content:center;gap:.65vw;margin:1.1vh 0}.icon{font-size:clamp(68px,5.3vw,105px);filter:drop-shadow(0 10px 18px #0008)}.weather{font-size:clamp(18px,1.28vw,25px);font-weight:750;line-height:1.35;text-align:center;min-height:3.2em;display:grid;place-items:center}
.temp{display:flex;align-items:end;justify-content:center;gap:1.2vw;margin:.7vh 0 1.1vh}.tempbox{text-align:center}.tempval{font-size:clamp(31px,2.8vw,55px);font-weight:850;line-height:1}.tempval.max{color:#ff968c}.tempval.min{color:#72ccff}.templabel{font-size:clamp(11px,.75vw,15px);color:var(--muted);margin-bottom:.45vh}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:.7vw;align-content:end}.metric{background:#0618279c;border:1px solid #ffffff12;border-radius:14px;padding:1.1vh .7vw}.mlabel{color:var(--muted);font-size:clamp(11px,.72vw,14px)}.mvalue{font-size:clamp(18px,1.25vw,25px);font-weight:800;margin-top:.35vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wide{grid-column:1/-1}.wind{font-size:clamp(13px,.84vw,17px);font-weight:650;white-space:normal;line-height:1.35;min-height:2.7em}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:.55vw;margin-top:1.2vh}.day{background:#0618279c;border:1px solid #ffffff12;border-radius:15px;padding:1.05vh .45vw;text-align:center;display:grid;grid-template-rows:auto auto auto auto;align-content:start}.day.today{border-color:#35d0ff88;background:#0a263c}.dayname{font-size:clamp(12px,.8vw,16px);font-weight:800;color:#d9efff}.daydate{font-size:clamp(10px,.65vw,13px);color:var(--muted);margin-top:.15vh}.dayicon{font-size:clamp(38px,3vw,58px);line-height:1.2;margin:.45vh 0}.daywx{font-size:clamp(11px,.71vw,14px);font-weight:700;line-height:1.3;height:2.6em;overflow:hidden}.daytemps{font-size:clamp(14px,.92vw,18px);font-weight:800;margin-top:.6vh}.hi{color:#ff968c}.lo{color:#72ccff}.daypop{font-size:clamp(11px,.7vw,14px);color:#d8e8f4;margin-top:.35vh}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:.55vw;margin-top:.9vh}.metric{background:#0618279c;border:1px solid #ffffff12;border-radius:12px;padding:.8vh .6vw}.mlabel{color:var(--muted);font-size:clamp(10px,.65vw,13px)}.mvalue{font-size:clamp(14px,.95vw,19px);font-weight:800;margin-top:.25vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wide{grid-column:1/-1}.wind{font-size:clamp(11px,.72vw,14px);font-weight:650;white-space:normal;line-height:1.3;min-height:2.6em}footer{display:grid;grid-template-columns:1fr auto;gap:1.5vw;align-items:center}.advice{display:flex;align-items:center;gap:1vw;background:linear-gradient(90deg,#173a52,#102a40);border:1px solid #ffffff18;border-radius:18px;padding:1.25vh 1.2vw;min-height:7.6vh}.adviceIcon{font-size:2vw}.adviceTitle{color:var(--yellow);font-size:clamp(13px,.86vw,17px);font-weight:800}.adviceText{font-size:clamp(17px,1.27vw,25px);font-weight:750;margin-top:.25vh}.meta{text-align:right;color:var(--muted);font-size:clamp(11px,.75vw,15px);line-height:1.55}.error{color:#ffb0b9}.warning{color:#fff;background:#a92f43;padding:.25vh .45vw;border-radius:7px}.spinner{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}#app{overflow:auto;height:auto;min-height:100vh}.card{min-height:42vh}html,body{overflow:auto}.brandmark{font-size:28px}.adviceIcon{font-size:30px}}
</style>
</head>
<body><div id="app">
<header><div class="brand"><div class="brandmark">🚚</div><div><h1>中国地方 ドライバー天気予報</h1><div class="sub">出発前に確認：雨・雪・風・警報</div></div></div><div class="clock"><div class="time" id="clock">--:--</div><div class="date" id="date">----</div></div></header>
<main class="cards" id="cards"></main>
<footer><div class="advice"><div class="adviceIcon" id="adviceIcon">✅</div><div><div class="adviceTitle">本日の運転ポイント</div><div class="adviceText" id="adviceText">最新の予報を取得しています</div></div></div><div class="meta"><div id="updated">更新確認中</div><div>予報・警報 出典：気象庁　｜　予報は毎日4:00更新・警報は10分ごと確認</div></div></footer>
</div>
<script>
const PREFS=[
 {name:'島根県',code:'320000',accent:'#51d5c7'},
 {name:'鳥取県',code:'310000',accent:'#65a9ff'},
 {name:'広島県',code:'340000',accent:'#ffbe55'},
 {name:'岡山県',code:'330000',accent:'#c58cff'}
];
const state={forecasts:{},warnings:{},lastUpdate:null};
const JMA='https://www.jma.go.jp/bosai';
const clean=s=>(s||'').replace(/[　\s]+/g,' ').trim();
const localYMD=(d=new Date())=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d);
function iconFor(code=''){const n=Number(code);if(n>=400)return'🌨️';if(n>=300)return'🌧️';if(n>=200)return'☁️';if(n>=100)return'☀️';return'🌤️'}
function cardShell(p){return `<section class="card" style="--accent:${p.accent}" id="card-${p.code}"><div class="prefrow"><div><div class="pref">${p.name}</div><div class="area">県内代表地点の3日予報</div></div><div class="status spinner">取得中</div></div><div class="days">${[0,1,2].map(i=>`<div class="day ${i===0?'today':''}"><div><div class="dayname">--</div><div class="daydate">--/--</div></div><div class="dayicon">⏳</div><div class="daywx">取得中</div><div><div class="daytemps"><span class="hi">--°</span> / <span class="lo">--°</span></div><div class="daypop">降水 --%</div></div></div>`).join('')}</div><div class="metrics"><div class="metric"><div class="mlabel">警報・注意報</div><div class="mvalue alerts">確認中</div></div><div class="metric"><div class="mlabel">今日の風</div><div class="mvalue wind">--</div></div></div></section>`}
function findTodayValues(ts,areaIndex,key){if(!ts?.timeDefines||!ts?.areas?.[areaIndex])return[];const vals=ts.areas[areaIndex][key]||[];const today=localYMD();return ts.timeDefines.map((t,i)=>({t,v:vals[i]})).filter(x=>x.t.startsWith(today)&&x.v!==''&&x.v!=null).map(x=>Number(x.v)).filter(Number.isFinite)}
function fmtDay(iso,i){const d=new Date(iso),wd=['日','月','火','水','木','金','土'][d.getDay()];return {name:i===0?'今日':i===1?'明日':`明後日`,date:`${d.getMonth()+1}/${d.getDate()} (${wd})`}}
function firstNum(v){const n=Number(v);return Number.isFinite(n)?n:null}
function parseForecast(json){
 const short=json[0],weekly=json[1], today=localYMD();
 const wxTs=short.timeSeries?.find(x=>x.areas?.[0]?.weathers), area=wxTs?.areas?.[0];
 const popTs=short.timeSeries?.find(x=>x.areas?.[0]?.pops); const popIdx=Math.max(0,popTs?.areas?.findIndex(a=>a.area.code===area?.area.code)||0);
 const tempTs=short.timeSeries?.find(x=>x.areas?.[0]?.temps); let temps=[];for(let i=0;i<(tempTs?.areas?.length||0);i++)temps.push(...findTodayValues(tempTs,i,'temps'));temps=temps.filter(v=>v>-50&&v<60);
 const days=[{date:today,weather:clean(area?.weathers?.[0]||'情報なし'),code:area?.weatherCodes?.[0]||'',pop:(()=>{const a=findTodayValues(popTs,popIdx,'pops');return a.length?Math.max(...a):null})(),min:temps.length?Math.min(...temps):null,max:temps.length?Math.max(...temps):null}];
 const wts=weekly?.timeSeries?.find(x=>x.areas?.[0]?.weatherCodes), wa=wts?.areas?.[0];
 const tts=weekly?.timeSeries?.find(x=>x.areas?.[0]?.tempsMin), ta=tts?.areas?.[0];
 for(let i=0;i<(wts?.timeDefines?.length||0)&&days.length<3;i++){const date=wts.timeDefines[i].slice(0,10);if(date<=today)continue;days.push({date,weather:'週間予報',code:wa.weatherCodes?.[i]||'',pop:firstNum(wa.pops?.[i]),min:firstNum(ta?.tempsMin?.[i]),max:firstNum(ta?.tempsMax?.[i])})}
 while(days.length<3){const d=new Date(days[days.length-1].date+'T00:00:00+09:00');d.setDate(d.getDate()+1);days.push({date:localYMD(d),weather:'情報なし',code:'',pop:null,min:null,max:null})}
 return {area:area?.area?.name||wa?.area?.name||'県内',days,wind:clean(area?.winds?.[0]||'情報なし'),published:short.reportDatetime};}
function parseWarnings(json){const names=new Set();function walk(x){if(!x)return;if(Array.isArray(x)){x.forEach(walk);return}if(typeof x==='object'){if(x.status==='発表'&&typeof x.name==='string')names.add(x.name);Object.values(x).forEach(walk)}}walk(json);return [...names].filter(n=>/警報|注意報/.test(n)).slice(0,3)}
async function fetchJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function updateForecasts(){await Promise.all(PREFS.map(async p=>{try{const j=await fetchJson(`${JMA}/forecast/data/forecast/${p.code}.json?ts=${Date.now()}`);state.forecasts[p.code]=parseForecast(j)}catch(e){state.forecasts[p.code]={error:e.message}}}));state.lastUpdate=new Date();render();}
async function updateWarnings(){await Promise.all(PREFS.map(async p=>{try{const j=await fetchJson(`${JMA}/warning/data/warning/${p.code}.json?ts=${Date.now()}`);state.warnings[p.code]=parseWarnings(j)}catch(e){state.warnings[p.code]=[]}}));render();}
function render(){for(const p of PREFS){const el=document.getElementById(`card-${p.code}`),d=state.forecasts[p.code],w=state.warnings[p.code]||[];if(!d)continue;if(d.error){el.querySelector('.status').className='status error';el.querySelector('.status').textContent='取得エラー';continue}el.querySelector('.area').textContent=`${d.area}の3日予報`;el.querySelector('.status').className='status';el.querySelector('.status').textContent='最新';el.querySelectorAll('.day').forEach((de,i)=>{const x=d.days[i],f=fmtDay(x.date,i);de.querySelector('.dayname').textContent=f.name;de.querySelector('.daydate').textContent=f.date;de.querySelector('.dayicon').textContent=iconFor(x.code);de.querySelector('.daywx').textContent=i===0?x.weather:'天気傾向';de.querySelector('.hi').textContent=x.max==null?'--°':`${x.max}°`;de.querySelector('.lo').textContent=x.min==null?'--°':`${x.min}°`;de.querySelector('.daypop').textContent=x.pop==null?'降水 --%':`降水 ${x.pop}%`});el.querySelector('.wind').textContent=d.wind;const ae=el.querySelector('.alerts');ae.textContent=w.length?w.join('・'):'発表なし';ae.className='mvalue alerts'+(w.length?' warning':'')}
 const data=Object.values(state.forecasts).filter(x=>x&&!x.error),warns=Object.values(state.warnings).flat();const snow=data.some(x=>x.days?.some(y=>Number(y.code)>=400)),heavy=data.some(x=>x.days?.[0]?.pop>=50),strong=data.some(x=>/強/.test(x.wind));let msg='時間に余裕を持ち、車間距離を十分に確保してください。',ico='✅';if(warns.length){msg=`警報・注意報発表中：${[...new Set(warns)].slice(0,4).join('・')}。出発前に対象地域を確認してください。`;ico='🚨'}else if(snow){msg='3日以内に降雪傾向あり。冬用装備、橋上・日陰・峠道を確認。';ico='❄️'}else if(heavy){msg='本日、降水確率が高い地域あり。早めの減速、車間距離確保、冠水路の回避を。';ico='🌧️'}else if(strong){msg='強風予報あり。横風、橋上、トンネル出口、空荷車両のふらつきに注意。';ico='💨'}document.getElementById('adviceText').textContent=msg;document.getElementById('adviceIcon').textContent=ico;if(state.lastUpdate)document.getElementById('updated').textContent=`画面更新：${state.lastUpdate.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false})}`}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'long'})}
function schedule4am(){const now=new Date(),parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now).reduce((a,p)=>(a[p.type]=p.value,a),{});const currentJst=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute,+parts.second);let target=Date.UTC(+parts.year,+parts.month-1,+parts.day,4,0,5);if(target<=currentJst)target+=86400000;setTimeout(async()=>{await updateForecasts();await updateWarnings();schedule4am()},target-currentJst)}
document.getElementById('cards').innerHTML=PREFS.map(cardShell).join('');tick();setInterval(tick,1000);updateForecasts();updateWarnings();schedule4am();setInterval(updateWarnings,10*60*1000);
</script></body></html>
